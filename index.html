<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dana for Children - Educational videos, games, and activities for kids.">
    <!-- 2026 SEO: Canonical link placeholder (managed by React) -->
    <link rel="canonical" href="https://danaforchildren.com" />
    
    <title>دنا للأطفال | مرح وتعلم</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4FC3F7" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'dana-blue': '#4FC3F7',
              'dana-yellow': '#FFEB3B',
              'dana-green': '#81C784',
              'dana-coral': '#FF6F61',
              'dana-purple': '#BA68C8',
            },
            fontFamily: {
              'heading': ['"Baloo Bhaijaan 2"', 'cursive'],
              'subheading': ['"Baloo Bhaijaan 2"', 'cursive'],
              'body': ['"Cairo"', 'sans-serif'],
              'soft': ['"Cairo"', 'sans-serif'],
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              },
              pop: {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            },
            animation: {
              float: 'float 3s ease-in-out infinite',
              wiggle: 'wiggle 2s ease-in-out infinite',
              pop: 'pop 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "canvas-confetti": "https://esm.sh/canvas-confetti@^1.9.4"
  }
}
</script>
<style>
    /* Custom 3D Utilities for Memory Game */
    .preserve-3d {
        transform-style: preserve-3d;
    }
    .backface-hidden {
        backface-visibility: hidden;
    }
    .rotate-y-180 {
        transform: rotateY(180deg);
    }
</style>
</head>
  <body class="bg-gray-50 font-body text-gray-800">
    <div id="root"></div>
  </body>
</html>
